let D={prods:[],lists:[],tax:TAX0,log:[]},U={v:'home',q:'',mode:'local',band:20,loc:{n:'Johannesburg',lat:-26.2041,lng:28.0473,p:'Gauteng'},f:{fam:'',cat:'',sub:'',sup:[],prov:'',stock:false,max:''},sort:'match',cur:0,found:null,imp:null};

const S=[["Johannesburg","National"],["Pretoria","Province"],["Cape Town","National"],["Durban","Province"],["Bloemfontein","Local"],["Germiston","Local"]];let k=7;const rnd=()=>(k=k*16807%2147483647)/2147483647;

if($('#city'))$('#city').onchange=e=>{const c=CITY[e.target.value];U.loc={n:e.target.value,lat:c[0],lng:c[1],p:c[2]};render()};
if($('#gps'))$('#gps').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{U.loc={n:'My GPS location',lat:p.coords.latitude,lng:p.coords.longitude,p:''};render()},()=>alert('GPS permission was not granted. Choose a city or enter coordinates.')):alert('GPS is not available.');
if($('#setll'))$('#setll').onclick=()=>{const v=$('#ll').value.split(',').map(Number);if(v.length==2&&!v.some(isNaN)&&Math.abs(v[0])<=90&&Math.abs(v[1])<=180){U.loc={n:'Custom coordinates',lat:v[0],lng:v[1],p:''};render()}else alert('Enter coordinates like -26.2041, 28.0473')};
A.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{U.mode=e.dataset.mode;render()});A.querySelectorAll('[data-band]').forEach(e=>e.onclick=()=>{U.band=+e.dataset.band;render()});
if($('#ldemo'))$('#ldemo').onclick=()=>{demo();render()};if($('#rmdemo'))$('#rmdemo').onclick=()=>{D.prods=D.prods.filter(p=>p.src!=='demo');save();render()};
const F=U.f,set=(id,k,fn)=>{const e=$(id);if(e)e.onchange=()=>{fn?fn(e):F[k]=e.value;render()}};set('#ffam','fam',e=>{F.fam=e.value;F.cat=F.sub=''});set('#fcat','cat',e=>{F.cat=e.value;F.sub=''});set('#fsub','sub');set('#fprov','prov');set('#fmax','max');set('#fstock','',e=>F.stock=e.checked);set('#sort','',e=>U.sort=e.value);
A.querySelectorAll('[data-sup]').forEach(e=>e.onchange=()=>{F.sup=e.checked?[...F.sup,e.dataset.sup]:F.sup.filter(x=>x!==e.dataset.sup);render()});if($('#clr'))$('#clr').onclick=()=>{U.f={fam:'',cat:'',sub:'',sup:[],prov:'',stock:false,max:''};U.q='';render()};
A.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{const p=D.prods[+e.dataset.add];addItem(p.desc,p.spec,1,p.cat);e.textContent='Added';e.disabled=true});
A.querySelectorAll('[data-lv]').forEach(e=>e.onclick=()=>{const l=+e.dataset.lv,n=e.dataset.n;if(l==1)F.fam=n;else if(l==2)F.cat=n;else{F.sub=n;U.q='';U.v='finder'}render()});
A.querySelectorAll('[data-br]').forEach(e=>e.onclick=()=>{F.fam=e.dataset.br;F.cat=F.sub='';render()});if($('#seeall'))$('#seeall').onclick=()=>{U.q='';U.v='finder';render()};
if($('#lsel')){$('#lsel').onchange=e=>{U.cur=+e.target.value;render()};$('#lnew').onclick=()=>{D.lists.push({name:'New list',customer:'',location:'',rep:'',date:new Date().toISOString().slice(0,10),items:[]});U.cur=D.lists.length-1;save();render()};$('#ldup').onclick=()=>{const c=JSON.parse(JSON.stringify(L()));c.name+=' (copy)';D.lists.push(c);U.cur=D.lists.length-1;save();render()};$('#ldel').onclick=()=>{const dl=D.lists[U.cur];if(sb&&dl&&dl.id)sb.from('saved_lists').delete().eq('id',dl.id).then(()=>{});D.lists.splice(U.cur,1);U.cur=0;save();render()};
A.querySelectorAll('[data-lf]').forEach(e=>e.onchange=()=>{L()[e.dataset.lf]=e.value;save();if(e.dataset.lf=='name')render()});A.querySelectorAll('[data-it]').forEach(e=>e.onchange=()=>{L().items[+e.dataset.it][e.dataset.k]=e.dataset.k=='qty'?Math.max(1,+e.value||1):e.value;save()});A.querySelectorAll('[data-rm]').forEach(e=>e.onclick=()=>{L().items.splice(+e.dataset.rm,1);save();render()});
$('#nadd').onclick=()=>{if($('#nt').value.trim()){addItem($('#nt').value,$('#ns').value,+$('#nq').value||1,'');render()}};$('#findall').onclick=findAll;
$('#exp').onclick=()=>{const l=L(),c=['Product,Specification,Quantity,Category,Notes',...l.items.map(i=>[i.text,i.spec,i.qty,i.cat,i.notes].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','))].join('\n');$('#out').innerHTML=`<div class="card"><b>${esc(l.name)}</b> – ${esc(l.customer)} · ${esc(l.location)} · ${esc(l.rep)} · ${esc(l.date)}<textarea rows="8" style="width:100%" readonly>${esc(c)}</textarea><div class="m">Copy this and paste into Excel.</div></div>`}}
if($('#imp')){$('#file').onchange=e=>{const r=new FileReader();r.onload=()=>{$('#paste').value=r.result};r.readAsText(e.target.files[0])};$('#imp').onclick=()=>doImport($('#paste').value);$('#tadd').onclick=()=>{const f=$('#tf').value.trim(),c=$('#tc').value.trim(),s=$('#ts').value.trim();if(!f)return;D.tax[f]=D.tax[f]||{};if(c){D.tax[f][c]=D.tax[f][c]||[];if(s&&!D.tax[f][c].includes(s))D.tax[f][c].push(s)}save();render()};A.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{delete D.tax[e.dataset.del];save();render()})}}
function addItem(text,spec,qty,cat){if(!D.lists.length)D.lists.push({name:'New list',customer:'',location:'',rep:'',date:new Date().toISOString().slice(0,10),items:[]});D.lists[U.cur].items.push({text,spec,qty,cat,notes:''});save()}
$('#nav').onclick=e=>{if(e.target.dataset.v){U.v=e.target.dataset.v;render()}};render();boot();
</script></body></html>
